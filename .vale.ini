# Prose linting for the posts.  Run:  vale content/posts/
# Style packages are vendored under styles/ (refresh: `vale sync` to the global
# cache, then re-copy write-good/proselint/alex into styles/).
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex

# Silence rules that are pure noise on technical writing:
write-good.E-Prime = NO          # flags every "to be" verb
Vale.Spelling = NO               # flags Kubernetes/Crossplane/etc.; Harper handles spelling
alex.ProfanityUnlikely = NO      # false positives on "kill", "abort", "hang"
alex.ProfanityMaybe = NO
