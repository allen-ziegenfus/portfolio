# Prose linting for the posts.
# Setup:  vale sync   (downloads the packages to Vale's default styles path)
# Run:    vale content/posts/
MinAlertLevel = suggestion

Packages = write-good, proselint, alex

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex

# Silence rules that are pure noise on technical writing:
write-good.E-Prime = NO          # flags every "to be" verb — not a real goal here
Vale.Spelling = NO               # flags Kubernetes/Crossplane/kubectl/etc.; Harper handles spelling
alex.ProfanityUnlikely = NO      # false positives on "kill", "abort", "hang", "die"
alex.ProfanityMaybe = NO
