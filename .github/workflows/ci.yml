name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    # Same image the baselines are generated in (npm run test:visual:docker),
    # so CI renders identically — no cross-OS font/anti-aliasing false diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          apt-get update -qq
          apt-get install -y -qq wget
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          dpkg -i /tmp/hugo.deb || apt-get install -y -f

      - name: Install dependencies
        run: npm ci

      - name: Visual regression tests
        run: npx playwright test

      - name: Upload Playwright report (diffs on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
