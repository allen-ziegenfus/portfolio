name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    # Same image the baselines are generated in (npm run test:visual:docker),
    # so CI renders identically — no cross-OS font/anti-aliasing false diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          apt-get update -qq
          apt-get install -y -qq wget
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          dpkg -i /tmp/hugo.deb || apt-get install -y -f

      - name: Install dependencies
        run: npm ci

      - name: Visual regression tests
        run: npx playwright test

      - name: Upload Playwright report (diffs on failure)
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Comment report link on the PR
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- visual-report -->';
            const status = process.env.JOB_STATUS === 'success' ? '✅ passed' : '❌ failed';
            const body = [
              marker,
              `### Visual regression: ${status}`,
              '',
              `📊 **[Download the Playwright report](${process.env.ARTIFACT_URL})** — unzip and open \`playwright-report/index.html\` for the actual / expected / diff slider.`,
              '',
              `Failures (if any) also appear as inline annotations on this run.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  changes:
    # Detect whether the PR touches content, so prose only runs when it's relevant.
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.filter.outputs.content }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content:
              - 'content/**'

  prose:
    # Advisory only (branch protection requires `visual`), fail_on_error: false.
    # Runs only on content PRs and leaves inline review comments on the new prose.
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Vale prose lint (advisory, inline comments)
        uses: errata-ai/vale-action@reviewdog
        with:
          files: content/posts
          fail_on_error: false
          reporter: github-pr-review
          filter_mode: added
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
