{{- /* Enrich social cards: image dimensions + Twitter card.
       PaperMod's opengraph emits og:image but not width/height for path-based
       images, and no Twitter tags — several preview scrapers need these. */ -}}
{{- with .Params.images }}
{{- $img := (index . 0) | absURL }}
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="{{ $.Title }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ $img }}" />
<meta name="twitter:title" content="{{ $.Title }}" />
<meta name="twitter:description" content="{{ ($.Description | default $.Summary | default site.Params.description) | plainify }}" />
{{- end }}
