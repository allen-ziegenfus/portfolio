<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#a78bfa" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- baseline sweep down to lower-left -->
  <path d="M150 168 L58 250" fill="none" stroke="#5b21b6" stroke-width="6" stroke-linecap="round"/>
  <!-- R bowl: dotted dome, upper-left -->
  <path d="M150 168 L150 92 A58 64 0 0 0 70 162 Z" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linejoin="round"/>
  <g fill="#c4b5fd">
    <circle cx="98" cy="122" r="4"/><circle cx="118" cy="112" r="4"/><circle cx="133" cy="130" r="4"/>
    <circle cx="108" cy="142" r="4"/><circle cx="123" cy="148" r="4"/><circle cx="92" cy="150" r="4"/>
  </g>
  <!-- hatched triangle, center -->
  <path d="M80 165 L150 165 L102 206 Z" fill="url(#hatch)" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round"/>
  <!-- A: apex-up filled triangle, upper-right, 3 circles -->
  <path d="M150 162 L214 162 L206 74 Z" fill="#6d28d9" stroke="#4c1d95" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ffffff">
    <ellipse cx="185" cy="122" rx="7" ry="9"/><ellipse cx="200" cy="122" rx="7" ry="9"/><ellipse cx="192" cy="105" rx="7" ry="9"/>
  </g>
  <!-- chevron leg, lower-right -->
  <path d="M150 165 L188 230 L224 164" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
